name: Installing Python

on: [push]

jobs:
  build:
    strategy:
      matrix: 
        os: [ubuntu-latest, macos-14, windows-latest]
        py_version: [3.10, 3.11, 3.12]
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: $py_version
        
